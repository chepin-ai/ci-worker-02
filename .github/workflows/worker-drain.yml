name: worker-drain
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: drain public-safe 队列
        run: python3 worker_drain.py
        env:
          WORKER_NAME: ${{ github.repository }}
      - name: commit results
        run: |
          git config user.name 'worker-drain[bot]'; git config user.email 'bot@users.noreply.github.com'
          git add results/ pulse.log
          git diff --cached --quiet || git commit -m "worker-drain 轮次"
          git push
